version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: lms_postgres_container
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  lms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_app_container
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: lms_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data: